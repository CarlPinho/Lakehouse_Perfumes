bundle:
  name: rotaperfume-direcao

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID
  genie_space_id:
    description: Default Genie Space ID
  genie_space_name:
    description: Genie Space display name

resources:
  apps:
    app:
      name: "rotaperfume-direcao"
      description: "A fila dos 200 na tela do diretor"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      user_api_scopes:
        - dashboards.genie

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: genie-space
          genie_space:
            name: ${var.genie_space_name}
            space_id: ${var.genie_space_id}
            permission: CAN_RUN

targets:
  default:
    default: true
    workspace:
      host: https://dbc-3914c6d4-fd43.cloud.databricks.com

    variables:
      sql_warehouse_id: 56d370db542b32f1
      genie_space_id: 01f1a2f88588160ca36da824d09180c2
      genie_space_name: Rota do Perfume · Direção
