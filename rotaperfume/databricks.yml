# Declarative Automation Bundle definition for rotaperfume.
# Documentation: https://docs.databricks.com/dev-tools/bundles/index.html

bundle:
  name: rotaperfume
  uuid: 8fd67d3b-2a1e-4ba9-a4a9-5da91a07e168

include:
  - resources/*.yml

# Variable declarations
variables:
  catalog:
    description: O catálogo Unity Catalog principal
    default: lakehouse_rotaperfume
  warehouse_id:
    description: ID do SQL Warehouse Serverless
    default: 56d370db542b32f1

targets:
  dev:
    # ARMADILHA IMPORTANTE: NÃO usamos `mode: development` no target dev.
    # O `mode: development` prefixa recursos com `[dev seu_usuario]` — inclusive
    # os SCHEMAS do Unity Catalog (ex.: dev_usuario_bronze), quebrando as consultas SQL.
    # Para garantir isolamento seguro sem corromper schemas, pausamos os agendamentos explicitamente:
    presets:
      trigger_pause_status: PAUSED
    default: true
    workspace:
      host: https://dbc-3914c6d4-fd43.cloud.databricks.com
    variables:
      catalog: lakehouse_rotaperfume
      warehouse_id: 56d370db542b32f1

  prod:
    mode: production
    workspace:
      host: https://dbc-3914c6d4-fd43.cloud.databricks.com
      root_path: /Workspace/Users/carloscold6@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: lakehouse_rotaperfume
      warehouse_id: 56d370db542b32f1
    permissions:
      - user_name: carloscold6@gmail.com
        level: CAN_MANAGE

